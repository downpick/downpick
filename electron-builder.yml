appId: com.downpick.app
# productName and author come from package.json, which is also where Electron itself reads
# the name it shows in the dock and the macOS menu bar. One source of truth for both.
copyright: Downpick

directories:
  buildResources: build
  output: release

# Only the compiled main process, the built renderer, and the manifest. The TypeScript
# sources, the client's own node_modules, and the Monaco staging copy are all excluded;
# node_modules for pg/mssql/mongodb/oracledb is pulled in automatically from "dependencies".
files:
  - .electron-out/**/*
  - client/dist/**/*
  - package.json
  # Needed at runtime on Linux, where the window/taskbar icon comes from the BrowserWindow
  # rather than the bundle. macOS and Windows read theirs from the packaged app itself.
  - build/icon.png
  - '!**/*.map'
  - '!.electron-out/**/*.test.js'
  # oracledb ships ~2.4 MB of prebuilt Thick-mode binaries for four platforms. The driver runs
  # in Thin mode (pure JavaScript) and never calls initOracleClient(), which is the only thing
  # that loads them — so none is ever dlopen'd and none needs to ship. Dropping them is also
  # what keeps `asar: true` viable and avoids any per-arch native handling.
  - '!**/node_modules/oracledb/build/**'

asar: true

# Ad-hoc signs the macOS bundle so Gatekeeper doesn't report it as damaged. No-op on other
# platforms and when a real certificate is configured. See scripts/adhoc-sign-mac.js.
afterPack: scripts/adhoc-sign-mac.js

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Unsigned by default. Set CSC_LINK/CSC_KEY_PASSWORD (and notarize) to ship signed builds.
  identity: null

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  category: Development
  synopsis: Standalone database manager for PostgreSQL, SQL Server, Oracle, and MongoDB
  # AppImage only. The deb target additionally requires a maintainer email, which means
  # putting a real address in package.json's "author" — deliberately not done.
  target:
    - target: AppImage
      arch: [x64]
